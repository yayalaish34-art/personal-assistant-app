# Render blueprint. Apply from the dashboard: New → Blueprint → pick this repo.
#
# Creates the database and the API service together and wires DATABASE_URL
# between them, so the connection string is never copied by hand.
#
# Secrets are marked `sync: false` — Render prompts for them at apply time and
# they are never committed. See the deploy notes in backend/README.md.

databases:
  - name: personal-assistant-db
    databaseName: personal_assistant
    user: pa_user
    plan: free

services:
  - type: web
    name: personal-assistant-api
    runtime: node
    plan: free
    rootDir: backend
    # `npm ci` respects the lockfile; postinstall generates the Prisma client,
    # which is generated code and is not present in node_modules otherwise.
    buildCommand: npm ci && npm run build
    # Migrations run at release rather than build time, so a failed migration
    # doesn't leave a half-built image.
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: personal-assistant-db
          property: connectionString
      # Generated by Render on first apply; both must differ from each other.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Prompted at apply time.
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
